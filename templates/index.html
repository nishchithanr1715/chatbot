<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot · DeepSeek</title>
  <meta name="description" content="Chat with DeepSeek AI — a fast, intelligent assistant powered by Flask and GitHub Models." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:        #0d0f14;
      --bg-surface:     #13161e;
      --bg-input:       #1c2030;
      --bg-user:        #5b5ef4;
      --bg-bot:         #1c2030;
      --border:         #ffffff12;
      --text-primary:   #e8eaf0;
      --text-secondary: #8892a4;
      --accent:         #5b5ef4;
      --accent-glow:    #5b5ef440;
      --accent2:        #a78bfa;
      --red:            #f87171;
      --radius-lg:      18px;
      --shadow:         0 8px 32px #00000060;
      --transition:     0.2s ease;
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-base); color: var(--text-primary); }

    .app-wrapper {
      display: flex; flex-direction: column;
      height: 100vh; max-width: 860px; margin: 0 auto;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px;
      background: var(--bg-surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .avatar-wrap {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 18px var(--accent-glow); flex-shrink: 0;
    }
    .avatar-wrap svg { width: 22px; height: 22px; fill: #fff; }
    .header-info h1 { font-size: 1.05rem; font-weight: 600; }
    .header-info p  { font-size: 0.75rem; color: var(--text-secondary); margin-top: 1px; }
    .status-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #34d399; margin-right: 5px; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    #btn-clear {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-secondary); font-size: 0.8rem; font-family: inherit;
      cursor: pointer; transition: var(--transition);
    }
    #btn-clear:hover { background: #ff444415; border-color: var(--red); color: var(--red); }
    #btn-clear svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── Messages ────────────────────────────────── */
    #messages {
      flex: 1; overflow-y: auto; padding: 28px 24px;
      display: flex; flex-direction: column; gap: 20px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* welcome */
    .welcome {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; margin: auto 0;
      text-align: center; padding: 40px 20px;
    }
    .welcome .big-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px var(--accent-glow);
    }
    .welcome .big-avatar svg { width: 36px; height: 36px; fill: #fff; }
    .welcome h2 { font-size: 1.5rem; font-weight: 700; }
    .welcome p  { font-size: 0.9rem; color: var(--text-secondary); max-width: 380px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
    .chip {
      padding: 8px 16px; border-radius: 99px;
      border: 1px solid var(--border); background: var(--bg-surface);
      font-size: 0.8rem; color: var(--text-secondary);
      cursor: pointer; transition: var(--transition);
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

    /* message row */
    .msg-row { display: flex; align-items: flex-end; gap: 10px; animation: fadeUp .25s ease; }
    .msg-row.user { flex-direction: row-reverse; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .msg-avatar.bot  { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .msg-avatar.user { background: #ffffff18; }
    .msg-avatar svg  { width: 16px; height: 16px; fill: #fff; }

    .bubble {
      max-width: 72%; padding: 14px 18px; border-radius: var(--radius-lg);
      font-size: 0.9rem; line-height: 1.65; word-wrap: break-word;
    }
    .bubble.bot  { background: var(--bg-bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .bubble.user { background: var(--bg-user); border-bottom-right-radius: 4px; color: #fff; }

    /* markdown inside bot bubble */
    .bubble.bot p  { margin-bottom: 10px; }
    .bubble.bot p:last-child { margin-bottom: 0; }
    .bubble.bot ul, .bubble.bot ol { margin: 8px 0 8px 20px; }
    .bubble.bot li { margin-bottom: 4px; }
    .bubble.bot h1,.bubble.bot h2,.bubble.bot h3 { margin: 12px 0 6px; font-weight: 600; }
    .bubble.bot code {
      background: #0008; padding: 2px 6px; border-radius: 4px;
      font-size: 0.82rem; font-family: 'Fira Code', monospace;
    }
    .bubble.bot pre {
      background: #0a0c12; border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; margin: 10px 0; overflow-x: auto;
    }
    .bubble.bot pre code { background: transparent; padding: 0; }

    /* typing indicator */
    .typing-bubble {
      display: flex; align-items: center; gap: 5px;
      padding: 14px 18px; background: var(--bg-bot);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg); border-bottom-left-radius: 4px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-secondary); animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }

    /* ── Input bar ───────────────────────────────── */
    .input-area {
      padding: 16px 24px 20px;
      background: var(--bg-surface); border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-row {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 10px 12px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .input-row:focus-within {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #user-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-family: inherit; font-size: 0.9rem;
      resize: none; max-height: 160px; line-height: 1.5;
    }
    #user-input::placeholder { color: var(--text-secondary); }
    #send-btn {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition); align-self: flex-end;
    }
    #send-btn:hover  { background: var(--accent2); transform: scale(1.05); }
    #send-btn:active { transform: scale(0.97); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #send-btn svg { width: 18px; height: 18px; fill: #fff; }
    .input-hint { text-align: center; font-size: 0.7rem; color: var(--text-secondary); margin-top: 10px; }
  </style>
</head>
<body>
<div class="app-wrapper">

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="avatar-wrap">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm1 14.93V15a1 1 0 0 0-2 0v1.93A8.01 8.01 0 0 1 4.07 11H6a1 1 0 0 0 0-2H4.07A8.01 8.01 0 0 1 11 4.07V6a1 1 0 0 0 2 0V4.07A8.01 8.01 0 0 1 19.93 11H18a1 1 0 0 0 0 2h1.93A8.01 8.01 0 0 1 13 16.93z"/></svg>
      </div>
      <div class="header-info">
        <h1>AI Assistant</h1>
        <p><span class="status-dot"></span>DeepSeek-V3 · Online</p>
      </div>
    </div>
    <button id="btn-clear" title="Clear conversation">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      Clear chat
    </button>
  </header>

  <!-- Messages -->
  <div id="messages">
    <div class="welcome" id="welcome-screen">
      <div class="big-avatar">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm1 14.93V15a1 1 0 0 0-2 0v1.93A8.01 8.01 0 0 1 4.07 11H6a1 1 0 0 0 0-2H4.07A8.01 8.01 0 0 1 11 4.07V6a1 1 0 0 0 2 0V4.07A8.01 8.01 0 0 1 19.93 11H18a1 1 0 0 0 0 2h1.93A8.01 8.01 0 0 1 13 16.93z"/></svg>
      </div>
      <h2>How can I help you?</h2>
      <p>I'm powered by DeepSeek-V3 via GitHub Models. Ask me anything — code, ideas, analysis, or just a chat!</p>
      <div class="chips">
        <span class="chip" onclick="sendChip(this)">✨ Write a poem</span>
        <span class="chip" onclick="sendChip(this)">💻 Explain recursion</span>
        <span class="chip" onclick="sendChip(this)">📝 Summarise a topic</span>
        <span class="chip" onclick="sendChip(this)">🌍 Translate something</span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Message AI assistant…"
        aria-label="Type your message"></textarea>
      <button id="send-btn" title="Send message" disabled>
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
  </div>

</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const clearBtn   = document.getElementById('btn-clear');
  const welcomeEl  = document.getElementById('welcome-screen');

  // Conversation history stored client-side: [{role, content}, ...]
  let history = [];

  const BOT_ICON  = `<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm1 14.93V15a1 1 0 0 0-2 0v1.93A8.01 8.01 0 0 1 4.07 11H6a1 1 0 0 0 0-2H4.07A8.01 8.01 0 0 1 11 4.07V6a1 1 0 0 0 2 0V4.07A8.01 8.01 0 0 1 19.93 11H18a1 1 0 0 0 0 2h1.93A8.01 8.01 0 0 1 13 16.93z"/></svg>`;
  const USER_ICON = `<svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>`;

  // ── Auto-resize textarea ──────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    sendBtn.disabled = inputEl.value.trim() === '';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // ── Chip shortcuts ────────────────────────────
  function sendChip(el) {
    const text = el.textContent.replace(/^.{2}\s*/, '');
    inputEl.value = text;
    inputEl.dispatchEvent(new Event('input'));
    sendMessage();
  }

  // ── Append a bubble ───────────────────────────
  function appendMessage(role, text) {
    welcomeEl.style.display = 'none';

    const row    = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar    = document.createElement('div');
    avatar.className = `msg-avatar ${role}`;
    avatar.innerHTML = role === 'bot' ? BOT_ICON : USER_ICON;

    const bubble    = document.createElement('div');
    bubble.className = `bubble ${role}`;
    if (role === 'bot') {
      bubble.innerHTML = marked.parse(text);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  // ── Typing indicator ──────────────────────────
  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="msg-avatar bot">${BOT_ICON}</div>
      <div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping() {
    const row = document.getElementById('typing-row');
    if (row) row.remove();
  }

  // ── Send message ──────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    appendMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res  = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // Send full history so serverless backend is stateless
        body: JSON.stringify({ message: text, history }),
      });
      const data = await res.json();
      hideTyping();

      if (data.error) {
        appendMessage('bot', `⚠️ **Error:** ${data.error}`);
      } else {
        appendMessage('bot', data.reply);
        // Update client-side history
        history.push({ role: 'user',      content: text       });
        history.push({ role: 'assistant', content: data.reply });
        // Keep last 20 turns
        if (history.length > 40) history = history.slice(-40);
      }
    } catch (err) {
      hideTyping();
      appendMessage('bot', '⚠️ **Network error.** Please try again.');
    }

    inputEl.focus();
  }

  // ── Clear chat ────────────────────────────────
  clearBtn.addEventListener('click', () => {
    history = [];
    messagesEl.innerHTML = '';
    messagesEl.appendChild(welcomeEl);
    welcomeEl.style.display = '';
  });
</script>
</body>
</html>
